name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CUPY_CACHE_DIR: /tmp/cupy-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dataloader --extra sql --extra report --extra dev

      - name: Lint
        run: uv run ruff check raccoon test

      - name: Test
        run: uv run pytest -q
