[project]
name = "raccoon"
version = "0.1.0"
description = "Benchmark utilities for RAG experiment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "beir",
    "datasets>=4.7.0",
    "docx2txt>=0.9",
    "elasticsearch<9",
    "langchain>=1.2.12",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.19",
    "langchain-experimental",
    "langchain-huggingface",
    "langchain-text-splitters",
    "ollama",
    "pandas>=2.3.3",
    "rich",
    "sentence-transformers>=5.3.0",
    "sqlalchemy>=2.0.48",
    "testcontainers>=4.14.2",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
    "spacy>=3.8.14",
    "igraph>=1.0.0",
    "reportlab>=4.5.1",
    "faiss-cpu>=1.13.2",
]

[[tool.setuptools.packages.find]]
include = ["raccoon*"]
exclude = ["data*", "test*"]
